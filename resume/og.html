<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{font-family:Manrope,sans-serif;color:#eceef5;background:radial-gradient(700px 420px at 85% 10%,rgba(99,112,255,.35),transparent 70%),#0a0b10;display:flex;flex-direction:column;justify-content:center;padding:0 90px;box-sizing:border-box}
  .m{width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,#5566f5,#8b5cf6);display:grid;place-items:center;font-weight:800;font-size:36px;color:#fff;box-shadow:0 12px 40px -8px rgba(99,112,255,.7)}
  h1{font-size:84px;line-height:1.05;letter-spacing:-.035em;margin:36px 0 18px;font-weight:800}
  h1 span{background:linear-gradient(120deg,#a3adff,#c4a8ff);-webkit-background-clip:text;color:transparent}
  p{font-size:32px;color:#9aa1b3;margin:0;font-weight:500}
</style></head>
<body><div class="m">V</div><h1>Владислав<br><span>Frontend-розробник</span></h1><p>Лендінги та веб-застосунки · від $100</p></body></html>
